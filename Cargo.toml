[package]
name = "w10wheel"
# The version of W10Wheel, as the Java and .NET versions: also that of the exe (its version
# information and manifest, written by build.rs) and of About
version = "2.10.4"
edition = "2024"
publish = false

[[bin]]
name = "W10Wheel"
path = "src/main.rs"

[dependencies]
winsafe = { version = "0.0.29", features = ["gui", "shell"] }
